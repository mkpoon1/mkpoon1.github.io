<!DOCTYPE html>
<html>
<head>
    <title>INST630 - Homework 2: Component</title>

  <style>


  .component {
    display: grid;
    width: 500px;
    grid-template-areas:
      'image header' 
      'image date' 
      'image main' ;
    grid-template-columns: 150px 1fr;
    grid-template-rows: auto auto, 1fr;
    padding:20px;
    border: 1px solid #333;
    column-gap: 20px;
 
  }
  
  .image{
    grid-area: image;
    display: flex;
    justify-content: center;
    align-items:center;
    border: 0.5px solid #333;

  }

  .header{
    grid-area: header;
    align-items: flex-start;
    font-size: 2rem; /* Double the font size */
    font-weight: bold;
  }
  .date{
    grid-area: date;
    align-items: flex-start;
  }
  .main{
    grid-area: main;
    align-items: flex-end;
    margin-top: 25px;
  }

  
  </style>
</head>

<body>

  <div class="component">
    <div class="image">
       <img src="/hero.png" alt="hero clipart" width="100%"></div>
    <div class="header">header</div>
    <div class="date">July 6, 2026</div>
    <div class="main">this is a whole lot of text to see what it looks like when i keep typing and there is no movement in the falkjrewij iowerjiweojwonk weoijrweoj </div>
  </div>

</body>
</html>
