<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Access Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Report Access Portal</h1>
    <p>Welcome! Please select the type of report access you need.</p>
  </header>

  <main>
    <div class="tile-container">
      <a href="schools.html" class="nav-tile">
        <img src="images/graduation-hat.png" alt="Graduation Hat" class="tile-image">
        <div class="tile-text">
          <span class="tile-title"> Schools</span>
          <span class="tile-description"> Access to reports for a specific school.</span>
        </div>
      </a>

      <a href="https://www.google.com" class="nav-tile">
        <img src="images/school.png" alt="School Building" class="tile-image">
        <div class="tile-text">
          <span class="tile-title"> Administration</span>
          <span class="tile-description"> Access to reports for an administrative office.</span>
        </div>
      </a>
    </div>
  </main>


</body>
</html>
